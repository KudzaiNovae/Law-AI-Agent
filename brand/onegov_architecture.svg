<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3"
 orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#18181b"/></marker></defs>
<rect width="1180" height="900" fill="#ffffff"/>
<text x="590.0" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22"
 font-weight="bold" fill="#18181b">OneGov AI System Architecture</text><rect x="40" y="80" width="330" height="96" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="205.0" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Official Public Sources</text><text x="205.0" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Government Gazettes, Acts, Statutory</text><text x="205.0" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Instruments, General Notices,</text><text x="205.0" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">court judgments</text><line x1="205" y1="176" x2="205" y2="216" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><text x="215.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3f3f46">weekly collection</text><rect x="40" y="216" width="330" height="114" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/><text x="205.0" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Ingestion Layer</text><text x="205.0" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Automated document collection,</text><text x="205.0" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">de-duplication, PDF text extraction,</text><text x="205.0" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">chunking into 154,000+ passages,</text><text x="205.0" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">weekly refresh and redeploy</text><line x1="205" y1="330" x2="205" y2="370" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="370" width="330" height="114" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/><text x="205.0" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Legal Corpus and Indexes</text><text x="205.0" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">15,000+ instruments, 4,928 judgments</text><text x="205.0" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">ChromaDB vector index</text><text x="205.0" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">BM25 keyword index</text><text x="205.0" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">knowledge graph of amendments</text><rect x="450" y="306" width="320" height="106" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="610.0" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Retrieval Layer</text><text x="610.0" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Hybrid search: semantic (vectors)</text><text x="610.0" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">+ keyword (BM25), merged and</text><text x="610.0" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">re-ranked; returns the most</text><text x="610.0" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">relevant passages of law</text><line x1="370" y1="427" x2="450" y2="372" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="470" width="320" height="106" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="610.0" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Reasoning Layer</text><text x="610.0" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Large language model agent plans</text><text x="610.0" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">searches, reads retrieved law and</text><text x="610.0" y="554" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">writes plain-language answers,</text><text x="610.0" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">constrained to cite sources</text><line x1="610" y1="412" x2="610" y2="470" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><text x="620.0" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3f3f46">retrieved passages</text><rect x="850" y="306" width="290" height="270" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="995.0" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Application Layer</text><text x="995.0" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">FastAPI web application</text><text x="995.0" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46"></text><text x="995.0" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Chat with streaming answers</text><text x="995.0" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">and inline citations</text><text x="995.0" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Case-law library and filters</text><text x="995.0" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Original document downloads</text><text x="995.0" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Accounts, Plus/Pro tiers,</text><text x="995.0" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Paynow payments</text><text x="995.0" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Developer API for institutions</text><line x1="770" y1="523" x2="850" y2="480" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><text x="820.0" y="505.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3f3f46">cited answers</text><line x1="850" y1="400" x2="770" y2="359" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><text x="820.0" y="383.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3f3f46">questions</text><rect x="450" y="660" width="320" height="96" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="610.0" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Users</text><text x="610.0" y="708" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Citizens, SMEs, legal practitioners,</text><text x="610.0" y="726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">researchers, institutions — any</text><text x="610.0" y="744" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">browser on phone or computer</text><line x1="920" y1="576" x2="700" y2="660" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><text x="820.0" y="622.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3f3f46">HTTPS — onegovai.app</text><line x1="620" y1="660" x2="870" y2="585" stroke="#18181b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="660" width="330" height="96" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/><text x="205.0" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#18181b">Hosting</text><text x="205.0" y="708" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">Azure Container Apps</text><text x="205.0" y="726" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">single Docker container (~3 GB)</text><text x="205.0" y="744" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3f3f46">2 vCPU / 4 GB, automatic HTTPS</text><rect x="30" y="70" width="1120" height="700" fill="none" stroke="none"/></svg>