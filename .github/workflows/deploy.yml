name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR: onegovacr
  IMAGE: onegovacr.azurecr.io/onegov:latest
  APP: onegov
  RG: onegov-rg          # adjust if your resource group differs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets to add in GitHub → Settings → Secrets and variables:
      #   AZURE_CREDENTIALS  — output of:
      #     az ad sp create-for-rbac --name onegov-ci --role contributor \
      #       --scopes /subscriptions/<SUB_ID>/resourceGroups/<RG> --sdk-auth
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr login -n $ACR
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy
        run: |
          # unique revision suffix forces ACA to pull the new :latest image
          az containerapp update -n $APP -g $RG --image $IMAGE \
            --revision-suffix "r$(date +%Y%m%d%H%M)"
